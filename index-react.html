<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple React OIDC Page</title>
  </head>
  <body>
    <script>
      // Same IdP config as oidc-client.html. redirect_uri is derived from
      // this page's own URL by oidc_client.js, so no extra routing needed.
      //
      // Unlike oidc-client.html (a portable static file), this page only
      // runs inside this Vite project, so token_endpoint goes through the
      // dev proxy at /oidc-proxy/token (see vite.config.js) — the same fix
      // used by src/oidc/OidcClient.jsx, needed because this Keycloak client
      // rejects any fetch() carrying a browser Origin header.
      window.OIDC_CONFIG = {
      client_id: 'demo-client',
      authorization_endpoint: 'http://localhost:3000/realms/default/authorize',
      token_endpoint:  '/oidc-proxy/token',
      end_session_endpoint: 'http://localhost:3000/realms/default/logout',
      scope: 'openid profile email',
      redirect_uri: `${window.location.origin}`,   //pode ser assim, ele busca pelos parametros
      };
      
    </script>
    <script src="/oidc_client.js"></script>

    <div id="root"></div>
    <script type="module" src="/src/react/App.jsx"></script>
  </body>
</html>
